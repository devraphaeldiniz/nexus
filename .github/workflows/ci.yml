name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.35.5
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: adicionar uma suíte de testes automatizados quando ela existir no projeto.
